server.port=${PORT:8080}
spring.application.name=monster-trial

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,text/css,application/javascript

monster-trial.cors.allowed-origins=${MONSTER_TRIAL_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
monster-trial.runs.max-active=${MONSTER_TRIAL_MAX_ACTIVE_RUNS:5000}
monster-trial.runs.ttl-hours=${MONSTER_TRIAL_RUN_TTL_HOURS:24}
