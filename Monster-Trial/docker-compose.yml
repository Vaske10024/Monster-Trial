services:
  backend:
    build: ./backend
    environment:
      PORT: 8080
      MONSTER_TRIAL_ALLOWED_ORIGINS: http://localhost:8088,http://127.0.0.1:8088,http://localhost:5173,http://127.0.0.1:5173
      MONSTER_TRIAL_MAX_ACTIVE_RUNS: 5000
      MONSTER_TRIAL_RUN_TTL_HOURS: 24
    expose:
      - "8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8088:80"
